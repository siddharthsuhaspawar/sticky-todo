<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Keep only three lists — a calm, editorial todo app">
<link rel="icon" href="assets/icon.ico">
<title>Three Lists</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  /* ---------- Light (parchment) ---------- */
  :root{
    --paper:#f4efe6; --card:#fbf8f2; --line:#e6dccb; --line-soft:#ece3d4;
    --ink:#3a2c2e; --muted:#7a6a62; --faint:#9a8a80;
    --edit:#fff7ec;
    --burgundy:#5e1f2d; --rust:#7a3a2a; --gold:#9a6a3a;
    --box:#b09a8e; --danger:#b3402f;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  /* ---------- Dark (Sticky palette: deep base, elevated cards) ---------- */
  body.dark{
    --paper:#0c0c0e; --card:#1a1a1e; --line:#26262d; --line-soft:#202028;
    --ink:#f5f5f7; --muted:#86868b; --faint:#5a5a60;
    --edit:#222229;
    /* single accent — iOS blue, used for all three roles */
    --burgundy:#0a84ff; --rust:#0a84ff; --gold:#0a84ff;
    --box:#5a5a60; --danger:#ff453a; --success:#30d158;
  }
  /* cards read as raised surfaces on the deep base (not outlined boxes) */
  body.dark .col{ box-shadow:0 2px 6px rgba(0,0,0,.45), 0 18px 44px -14px rgba(0,0,0,.7); border-color:#24242b; }
  /* row/block hovers lighten (above the card) instead of cutting a dark hole */
  body.dark .todo-row:hover,
  body.dark .block.bullet:hover,
  body.dark .block.link:hover,
  body.dark .block.note .rich:hover,
  body.dark .reveal-btn:hover,
  body.dark .insert-bar button:hover{ background:#24242c; }
  /* headings stay clean white in dark (blue is for accents only) */
  body.dark .col h2, body.dark .col.n2 h2, body.dark .col.n3 h2{ color:var(--ink); }
  body.dark .add-button{ color:#fff; }
  /* completed to-dos → green */
  body.dark .todo.done > .todo-row .box,
  body.dark .n2 .todo.done > .todo-row .box,
  body.dark .n3 .todo.done > .todo-row .box{ background:var(--success); border-color:var(--success); }
  /* quotes → plain white (not blue) */
  body.dark .block.quote blockquote{ border-left-color:var(--muted); color:var(--ink); }

  body{
    font-family:var(--sans); background:var(--paper); color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:34px 24px 110px; overflow-x:hidden;
    transition:background-color .25s, color .25s;
  }
  ::-webkit-scrollbar{ width:3px; height:3px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--box); }
  ::-webkit-scrollbar-track{ background:transparent; }
  .content{ scrollbar-width:thin; scrollbar-color:var(--line) transparent; }

  /* ---------- Header ---------- */
  .topbar{ width:100%; max-width:1880px; display:flex; justify-content:flex-end; align-items:center; }

  /* macOS-style frameless title bar — only shown inside the Tauri app */
  .titlebar{ display:none; }
  body.tauri{ padding-top:46px; }
  body.tauri .titlebar{
    position:fixed; top:0; left:0; right:0; height:38px; z-index:2000;
    display:flex; align-items:center; padding:0 15px;
    -webkit-user-select:none; user-select:none;
  }
  .tl-controls{ display:flex; align-items:center; gap:8px; }
  .tl{
    width:12px; height:12px; border-radius:50%; border:none; padding:0; cursor:pointer;
    display:grid; place-items:center; line-height:1; font-size:9px; font-weight:700;
    color:rgba(0,0,0,.5); transition:filter .12s;
  }
  .tl-close{ background:#ff5f57; } .tl-min{ background:#febc2e; } .tl-max{ background:#28c840; }
  .tl span{ opacity:0; transform:translateY(-.5px); transition:opacity .12s; }
  .titlebar:hover .tl span{ opacity:1; }
  .tl:active{ filter:brightness(.85); }
  .tl-drag{ flex:1; align-self:stretch; }
  .icon-btn{
    font-family:var(--sans); font-size:16px; line-height:1; color:var(--muted);
    background:none; border:1px solid var(--line); border-radius:50%;
    width:38px; height:38px; cursor:pointer; transition:.18s; display:grid; place-items:center;
  }
  .icon-btn:hover{ color:var(--ink); border-color:var(--gold); background:var(--card); }

  /* ---------- Masthead ---------- */
  .masthead{ width:100%; max-width:1060px; margin:26px 0 28px; }
  .masthead h1{
    font-family:var(--serif); font-weight:400; font-size:clamp(30px,4.6vw,48px);
    color:var(--burgundy); letter-spacing:-.01em; line-height:1.04;
  }
  .masthead h1 .it{ font-style:italic; }
  .masthead p{ color:var(--muted); font-size:14px; margin-top:10px; max-width:560px; }

  /* ---------- Board / reveal ---------- */
  .board{
    display:flex; gap:22px; align-items:flex-start;
    width:100%; max-width:2400px;
    transition:max-width .55s cubic-bezier(.22,1,.36,1);
  }
  .board.solo{ max-width:400px; }

  .col{
    position:relative;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:32px 30px 28px;
    display:flex; flex-direction:column;
    box-shadow:0 1px 2px rgba(58,44,46,.05), 0 12px 32px -10px rgba(58,44,46,.14);
    transition:background-color .25s, border-color .25s, box-shadow .3s, transform .3s;
  }
  .col.primary{ flex:0 0 350px; min-width:320px; }

  /* drag the right edge to resize width, bottom edge to resize height
     (double-click a handle to reset) */
  .col-resize{
    position:absolute; top:0; bottom:16px; right:-14px; width:20px;
    cursor:col-resize; z-index:20; touch-action:none;
    display:flex; align-items:center; justify-content:center;
  }
  .col-resize::after{
    content:''; width:2px; height:22px; border-radius:2px; background:var(--line);
    opacity:0; transition:opacity .15s, height .15s, background-color .15s;
  }
  .col:hover .col-resize::after{ opacity:.35; }
  .col-resize:hover::after, .col-resize.dragging::after{ opacity:.9; background:var(--burgundy); height:40px; }
  body.dragging-col{ user-select:none; cursor:col-resize; }

  .col-resize-v{
    position:absolute; left:0; right:16px; bottom:-14px; height:20px;
    cursor:row-resize; z-index:20; touch-action:none;
    display:flex; align-items:center; justify-content:center;
  }
  .col-resize-v::after{
    content:''; height:2px; width:22px; border-radius:2px; background:var(--line);
    opacity:0; transition:opacity .15s, width .15s, background-color .15s;
  }
  .col:hover .col-resize-v::after{ opacity:.35; }
  .col-resize-v:hover::after, .col-resize-v.dragging::after{ opacity:.9; background:var(--burgundy); width:40px; }
  body.dragging-row{ user-select:none; cursor:row-resize; }

  /* when a fixed height is set, the list area scrolls instead of the card growing */
  .col.fixh .content{ flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; }

  /* Watch & Later deal out from behind To-Do with a springy 3D swing */
  .rest{
    display:flex; gap:22px; overflow:hidden;
    flex:1 1 0; max-width:0; opacity:0;
    transition:max-width .62s cubic-bezier(.22,1,.36,1), opacity .35s ease .08s;
  }
  .rest .col{
    flex:1 1 440px; min-width:380px;
    transform-origin:left center;
    transform:perspective(1500px) translateX(-46px) rotateY(-24deg) scale(.9);
    opacity:0; pointer-events:none;
    transition:transform .72s cubic-bezier(.2,.86,.28,1.18), opacity .5s ease, box-shadow .3s, background-color .25s, border-color .25s;
  }
  .rest .col.n3{ flex:3.2 1 900px; min-width:560px; }   /* Later = widest think space */
  .rest .content{ min-height:140px; }
  .board.open .rest{ max-width:2000px; opacity:1; overflow:visible; }
  .board.open .rest .col{
    transform:perspective(1500px) translateX(0) rotateY(0deg) scale(1);
    opacity:1; pointer-events:auto;
  }
  .board.open .rest .col.n2{ transition-delay:.05s; }
  .board.open .rest .col.n3{ transition-delay:.17s; }

  .tag{ font-family:var(--serif); font-style:italic; font-size:13.5px; color:var(--faint); margin:2px 0 2px; }
  .col h2{ font-family:var(--serif); font-style:italic; font-weight:400; font-size:29px; color:var(--burgundy); }
  .col.n2 h2{ color:var(--rust); } .col.n3 h2{ color:var(--gold); }
  .desc{ font-size:12.5px; color:var(--muted); line-height:1.45; margin:11px 0 14px; min-height:2.9em; }
  hr{ border:none; border-top:1px solid var(--line); margin-bottom:4px; }

  .content{ display:flex; flex-direction:column; min-height:8px; }
  .empty-hint{ font-size:12.5px; color:var(--faint); font-style:italic; padding:10px 2px; }

  /* ---------- top input (To-Do) ---------- */
  .input-section{ display:flex; gap:9px; margin:4px 0 12px; }
  .task-input{
    flex:1; padding:11px 14px; border:1px solid var(--line); border-radius:11px;
    background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:14.5px;
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .task-input::placeholder{ color:var(--faint); }
  .task-input:focus{ border-color:var(--burgundy); box-shadow:0 0 0 3px rgba(154,106,58,.16); }
  body.dark .task-input:focus{ box-shadow:0 0 0 3px rgba(10,132,255,.25); }
  .add-button{
    border:none; border-radius:11px; background:var(--burgundy); color:var(--paper);
    font-size:20px; font-weight:300; line-height:1; cursor:pointer; min-width:46px; transition:.15s;
  }
  .add-button:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  .add-button:active{ transform:none; }

  /* ---------- composer (Watch & Later: paste-image-then-caption) ---------- */
  .composer{ margin:4px 0 12px; }
  .composer-row{ display:flex; gap:9px; }
  .composer-thumbs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .composer-thumbs:empty{ display:none; }
  .thumb{
    position:relative; width:64px; height:64px; border-radius:10px; overflow:hidden;
    border:1px solid var(--line); background:var(--paper); flex:none;
    animation:slideIn .2s ease;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .thumb-x{
    position:absolute; top:2px; right:2px; width:18px; height:18px; border:none; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; font-size:12px; line-height:1; cursor:pointer;
    display:grid; place-items:center; padding:0;
  }
  .thumb .thumb-x:hover{ background:rgba(0,0,0,.85); }

  /* ---------- insert toolbar (Watch & Later) ---------- */
  .insert-bar{ display:flex; gap:4px; margin:-2px 0 16px; }
  .insert-bar button{
    width:32px; height:30px; border:none; border-radius:8px; padding:0;
    background:transparent; color:var(--faint); cursor:pointer; transition:.15s;
    display:grid; place-items:center;
  }
  .insert-bar button svg{ width:16px; height:16px; }
  .insert-bar button:hover{ background:var(--paper); color:var(--burgundy); }

  /* ---------- bullet & link blocks (freeform notes) ---------- */
  .block.bullet, .block.link{
    display:flex; align-items:flex-start; gap:9px; padding:5px 8px; margin:1px -8px;
    border-radius:8px; transition:background-color .15s;
  }
  .block.bullet:hover, .block.link:hover{ background:var(--paper); }
  .bdot{ flex:none; font-size:15px; line-height:1.6; user-select:none; margin-top:1px; color:var(--gold); }
  .n2 .bdot{ color:var(--rust); }
  .btext, .linktext{
    flex:1; font-size:14px; line-height:1.6; color:var(--ink); outline:none; white-space:pre-wrap; min-width:20px;
  }
  .btext:focus, .linktext:focus{ background:var(--edit); border-radius:4px; }
  .link-open{ flex:none; color:var(--muted); text-decoration:none; font-size:14px; padding:0 4px; align-self:center; }
  .link-open:hover{ color:var(--burgundy); }
  .block.bullet .del, .block.link .del{
    position:static; width:24px; height:24px; border-radius:6px; display:grid; place-items:center; align-self:center;
  }
  .block.bullet:hover .del, .block.link:hover .del{ opacity:.55; }
  .block.bullet .del:hover, .block.link .del:hover{ background:var(--card); }

  @keyframes slideIn{ from{ opacity:0; transform:translateX(-12px); } to{ opacity:1; transform:none; } }
  .just-in{ animation:slideIn .22s ease; }

  /* ---------- placeholder for editable blocks ---------- */
  [contenteditable][data-ph]:empty:before{ content:attr(data-ph); color:var(--faint); pointer-events:none; }

  /* ---------- block: to-do (+ sub-trees) ---------- */
  .block{ position:relative; }
  .block .del{
    position:absolute; top:5px; right:-2px; width:18px; height:18px; border:none;
    background:none; color:var(--faint); font-size:15px; cursor:pointer; opacity:0; transition:.15s; line-height:1;
  }
  .block:hover > .del, .block:hover > .todo-row .del{ opacity:.65; }
  .del:hover{ color:var(--danger); opacity:1 !important; }
  /* inline delete action for task rows (legacy style) */
  .todo-row .del{ position:static; width:24px; height:24px; border-radius:6px; display:grid; place-items:center; align-self:center; }
  .todo-row:hover .del{ opacity:.55; }
  .todo-row .del:hover{ background:var(--card); }

  .todo-row{ display:flex; align-items:center; gap:8px; padding:7px 8px; margin:1px -8px; border-radius:9px; position:relative; transition:background-color .15s; }
  .todo-row:hover{ background:var(--paper); }
  .twist{
    flex:none; width:15px; height:20px; border:none; background:none; cursor:pointer;
    color:var(--faint); font-size:9px; line-height:20px; text-align:center;
    transition:transform .18s; transform:rotate(0deg);
  }
  .twist.open{ transform:rotate(90deg); }
  .twist-sp{ flex:none; width:15px; }
  .box{ flex:none; width:19px; height:19px; border-radius:50%; border:2px solid var(--box); cursor:pointer; transition:.15s; position:relative; }
  .box:hover{ border-color:var(--burgundy); }
  .n2 .box:hover{ border-color:var(--rust); } .n3 .box:hover{ border-color:var(--gold); }
  .box::after{ content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); width:7px; height:7px; border-radius:50%; background:var(--card); transition:transform .15s; }
  .todo.done > .todo-row .box::after{ transform:translate(-50%,-50%) scale(1); }
  .todo.done > .todo-row .label{ text-decoration:line-through; color:var(--faint); }
  .todo.done > .todo-row .box{ background:var(--burgundy); border-color:var(--burgundy); }
  .n2 .todo.done > .todo-row .box{ background:var(--rust); border-color:var(--rust); }
  .n3 .todo.done > .todo-row .box{ background:var(--gold); border-color:var(--gold); }
  .label{ font-size:14.5px; line-height:1.4; color:var(--ink); flex:1; outline:none; min-width:20px; }
  .label:focus{ background:var(--edit); border-radius:3px; }
  .prog{ font-size:10.5px; color:var(--muted); align-self:center; font-variant-numeric:tabular-nums; background:var(--paper); border:1px solid var(--line); padding:1px 7px; border-radius:10px; }
  .mini{
    flex:none; border:none; background:none; color:var(--faint); cursor:pointer;
    font-size:15px; line-height:1; padding:2px 4px; border-radius:6px; opacity:0; transition:.15s; align-self:center;
  }
  .todo-row:hover .mini{ opacity:.6; } .mini:hover{ color:var(--burgundy); opacity:1; background:var(--card); }

  /* sub-tree connectors (├── / └──) — per-block segments, no masking */
  .children{ position:relative; margin-left:9px; padding-left:18px; }
  .children > .block.todo > .todo-row::before{           /* horizontal branch */
    content:''; position:absolute; left:-18px; top:50%; width:13px; height:1.5px; background:var(--box);
  }
  .children > .block.todo::before{                        /* trunk: parent → this row */
    content:''; position:absolute; left:-18px; top:0; width:1.5px; height:18px; background:var(--box);
  }
  .children > .block.todo:not(:last-child)::after{        /* trunk: this row → next sibling (spans subtree) */
    content:''; position:absolute; left:-18px; top:18px; bottom:0; width:1.5px; background:var(--box);
  }
  /* "+ Add subtask" as the closing └ branch */
  .subtask-add-row{ position:relative; padding:3px 0 2px; }
  .subtask-add-row::before{ content:''; position:absolute; left:-18px; top:0; width:1.5px; height:12px; background:var(--box); }
  .subtask-add-row::after{ content:''; position:absolute; left:-18px; top:12px; width:13px; height:1.5px; background:var(--box); }
  .subtask-add{
    font-family:var(--sans); font-size:12px; color:var(--faint); cursor:pointer;
    background:none; border:none; padding:2px 7px; border-radius:6px; transition:.15s;
  }
  .subtask-add:hover{ color:var(--burgundy); background:var(--paper); }

  /* ---------- block: note ---------- */
  .block.note .rich{ font-size:13.5px; line-height:1.5; color:var(--ink); padding:6px 8px; margin:0 -8px; border-radius:6px; outline:none; white-space:pre-wrap; transition:background-color .15s; }
  .block.note .rich:hover{ background:var(--paper); }
  .block.note .rich:focus{ background:var(--edit); }

  /* ---------- block: quote ---------- */
  .block.quote blockquote{
    border-left:3px solid var(--gold); padding:5px 0 5px 14px; margin:8px 0;
    font-family:var(--serif); font-style:italic; font-size:15px; line-height:1.45; color:var(--burgundy);
    outline:none; white-space:pre-wrap;
  }
  .block.quote blockquote:focus{ background:var(--edit); border-radius:0 4px 4px 0; }

  /* ---------- block: photo ---------- */
  .block.photo{ margin:10px 0; }
  .block.photo img{ width:100%; max-height:340px; object-fit:contain; border-radius:8px; border:1px solid var(--line); display:block; background:var(--paper); }
  .block.photo figcaption{ font-size:11.5px; color:var(--faint); text-align:center; margin-top:5px; font-style:italic; outline:none; }
  .block.photo figcaption:focus{ background:var(--edit); border-radius:4px; }

  /* ---------- add bar ---------- */
  .addbar{ position:relative; margin-top:10px; }
  .add-trigger{
    font-family:var(--sans); font-size:13px; color:var(--faint);
    background:none; border:1px dashed var(--line); border-radius:8px;
    padding:7px 12px; width:100%; text-align:left; cursor:pointer; transition:.15s;
  }
  .add-trigger:hover{ color:var(--burgundy); border-color:var(--gold); background:var(--card); }
  .add-menu{
    position:absolute; bottom:calc(100% + 6px); left:0; z-index:10;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.18); padding:6px; min-width:170px; display:none;
  }
  .add-menu.show{ display:block; }
  .add-menu button{
    display:flex; align-items:center; gap:10px; width:100%;
    font-family:var(--sans); font-size:13.5px; color:var(--ink);
    background:none; border:none; padding:8px 10px; border-radius:7px; cursor:pointer; text-align:left;
  }
  .add-menu button:hover{ background:var(--paper); }
  .add-menu .ic{ width:20px; text-align:center; font-size:15px; }

  /* ---------- reveal button ---------- */
  .reveal-btn{
    margin-top:20px; align-self:flex-start;
    display:inline-flex; align-items:center; gap:9px;
    font-family:var(--sans); font-size:13.5px; font-weight:500; color:var(--burgundy);
    background:transparent; border:1px solid var(--line); border-radius:999px;
    padding:9px 16px; cursor:pointer; transition:.18s;
  }
  .reveal-btn:hover{ background:var(--paper); border-color:var(--burgundy); }
  .reveal-btn .arrow{ display:inline-block; transition:transform .4s cubic-bezier(.22,1,.36,1); }
  .board.open .reveal-btn .arrow{ transform:rotate(180deg); }
  .board.open .reveal-btn .lbl-more{ display:none; }
  .reveal-btn .lbl-less{ display:none; }
  .board.open .reveal-btn .lbl-less{ display:inline; }

  @media (max-width:820px){
    .board, .board.solo{ max-width:100%; flex-direction:column; }
    .rest{ flex-direction:column; }
    .board.open .rest{ max-width:100%; }
  }
</style>
</head>
<body>
  <div class="titlebar">
    <div class="tl-controls">
      <button class="tl tl-close" onclick="app.win('close')" aria-label="Close"><span>&times;</span></button>
      <button class="tl tl-min" onclick="app.win('min')" aria-label="Minimize"><span>&minus;</span></button>
      <button class="tl tl-max" onclick="app.win('max')" aria-label="Maximize"><span>+</span></button>
    </div>
    <div class="tl-drag" data-tauri-drag-region></div>
  </div>
  <div class="topbar">
    <button class="icon-btn" id="themeBtn" title="Toggle dark mode" onclick="app.toggleTheme()">◐</button>
  </div>

  <div class="board solo" id="board">
    <!-- 01 — To-Do -->
    <div class="col primary n1" id="col-todo">
      <div class="tag">What you must do</div>
      <h2>To-Do</h2>
      <div class="desc">Commitments and obligations. Keep it tight — just tasks.</div>
      <hr>
      <div class="input-section">
        <input type="text" class="task-input" id="todoInput" placeholder="What needs to be done?"
               onkeydown="if(event.key==='Enter')app.addTodoFromInput()" autocomplete="off">
        <button class="add-button" onclick="app.addTodoFromInput()" aria-label="Add task">+</button>
      </div>
      <div class="content" id="list-todo"></div>
      <button class="reveal-btn" onclick="app.toggleBoard()">
        <span class="lbl-more">Show Watch &amp; Later</span>
        <span class="lbl-less">Focus on To-Do</span>
        <span class="arrow">→</span>
      </button>
      <div class="col-resize" title="Drag to resize width · double-click to reset" onpointerdown="app.startResize(event,'todo')" ondblclick="app.resetWidth('todo')"></div>
      <div class="col-resize-v" title="Drag to resize height · double-click to reset" onpointerdown="app.startResizeV(event,'todo')" ondblclick="app.resetHeight('todo')"></div>
    </div>

    <!-- 02 + 03 -->
    <div class="rest">
      <div class="col n2" id="col-watch">
        <div class="tag">What you're tracking</div>
        <h2>Watch</h2>
        <div class="desc">Follow-ups, references, anything to keep an eye on.</div>
        <hr>
        <div class="composer">
          <div class="composer-thumbs" id="thumbs-watch"></div>
          <div class="composer-row">
            <input type="text" class="task-input" id="input-watch" placeholder="Jot something down… or paste an image"
                   onkeydown="if(event.key==='Enter')app.composerSubmit('watch')" autocomplete="off">
            <button class="add-button" onclick="app.composerSubmit('watch')" aria-label="Add">+</button>
          </div>
        </div>
        <div class="insert-bar">
          <button onclick="app.addBlock('watch','photo')" title="Insert photo" aria-label="Insert photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 15.5l-5-4.5L5 20"/></svg></button>
          <button onclick="app.addBlock('watch','link')" title="Insert link" aria-label="Insert link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.5a4 4 0 0 0 5.66 0l3-3A4 4 0 0 0 13 4.84l-1.2 1.2"/><path d="M14 10.5a4 4 0 0 0-5.66 0l-3 3A4 4 0 0 0 11 19.16l1.2-1.2"/></svg></button>
          <button onclick="app.addBlock('watch','quote')" title="Insert quote" aria-label="Insert quote"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.5 7.5c-2.3 0-4 1.9-4 4.2V17h4.6v-5H7.4c0-1.3.9-2.3 2.1-2.4zM18.1 7.5c-2.3 0-4 1.9-4 4.2V17h4.6v-5H16c0-1.3.9-2.3 2.1-2.4z"/></svg></button>
        </div>
        <div class="content" id="list-watch"></div>
        <div class="col-resize" title="Drag to resize width · double-click to reset" onpointerdown="app.startResize(event,'watch')" ondblclick="app.resetWidth('watch')"></div>
        <div class="col-resize-v" title="Drag to resize height · double-click to reset" onpointerdown="app.startResizeV(event,'watch')" ondblclick="app.resetHeight('watch')"></div>
      </div>
      <div class="col n3" id="col-later">
        <div class="tag">Everything else</div>
        <h2>Later</h2>
        <div class="desc">Someday / maybe. Ideas, clippings, wishlist.</div>
        <hr>
        <div class="composer">
          <div class="composer-thumbs" id="thumbs-later"></div>
          <div class="composer-row">
            <input type="text" class="task-input" id="input-later" placeholder="Jot something down… or paste an image"
                   onkeydown="if(event.key==='Enter')app.composerSubmit('later')" autocomplete="off">
            <button class="add-button" onclick="app.composerSubmit('later')" aria-label="Add">+</button>
          </div>
        </div>
        <div class="insert-bar">
          <button onclick="app.addBlock('later','photo')" title="Insert photo" aria-label="Insert photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 15.5l-5-4.5L5 20"/></svg></button>
          <button onclick="app.addBlock('later','link')" title="Insert link" aria-label="Insert link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.5a4 4 0 0 0 5.66 0l3-3A4 4 0 0 0 13 4.84l-1.2 1.2"/><path d="M14 10.5a4 4 0 0 0-5.66 0l-3 3A4 4 0 0 0 11 19.16l1.2-1.2"/></svg></button>
          <button onclick="app.addBlock('later','quote')" title="Insert quote" aria-label="Insert quote"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.5 7.5c-2.3 0-4 1.9-4 4.2V17h4.6v-5H7.4c0-1.3.9-2.3 2.1-2.4zM18.1 7.5c-2.3 0-4 1.9-4 4.2V17h4.6v-5H16c0-1.3.9-2.3 2.1-2.4z"/></svg></button>
        </div>
        <div class="content" id="list-later"></div>
        <div class="col-resize" title="Drag to resize width · double-click to reset" onpointerdown="app.startResize(event,'later')" ondblclick="app.resetWidth('later')"></div>
        <div class="col-resize-v" title="Drag to resize height · double-click to reset" onpointerdown="app.startResizeV(event,'later')" ondblclick="app.resetHeight('later')"></div>
      </div>
    </div>
  </div>

  <input type="file" id="photoInput" accept="image/*" style="display:none">

<script>
class ThreeLists{
  constructor(){
    this.KEY='three-lists-data';
    this.THEME='three-lists-dark';
    this.data={ revealed:false, sizes:{todo:360, watch:470, later:840}, heights:{}, lists:{ todo:[], watch:[], later:[] } };
    this.dark=true;
    this.pendingList=null;
    this.composer={ watch:[], later:[] };   // pending pasted images per list
  }

  /* ---------- lifecycle ---------- */
  init(){
    if(window.__TAURI__) document.body.classList.add('tauri');   // frameless title bar
    this.load();
    this.applyTheme();
    if(this.data.revealed){
      const b=document.getElementById('board');
      b.classList.add('open'); b.classList.remove('solo');
    }
    this.applySizes();
    this.render();
    this.wireGlobal();
  }
  load(){
    try{ const d=JSON.parse(localStorage.getItem(this.KEY)); if(d&&d.lists) this.data=d; }catch(e){}
    this.data.sizes = Object.assign({todo:360, watch:470, later:840}, this.data.sizes||{});
    this.data.heights = this.data.heights || {};
    if(!this.data.lists.todo.length && !this.data.lists.watch.length && !this.data.lists.later.length) this.seed();
    const t=localStorage.getItem(this.THEME); this.dark = (t===null) ? true : t==='1';
  }
  save(){ localStorage.setItem(this.KEY, JSON.stringify(this.data)); }
  seed(){
    this.data.lists.todo=[
      this.mkTodo('Ship the Q3 report'),
      Object.assign(this.mkTodo('Review PR #214'),{children:[this.mkTodo('Read the diff'),Object.assign(this.mkTodo('Leave comments'),{done:true})]}),
      Object.assign(this.mkTodo('Call the dentist'),{done:true}),
    ];
    this.data.lists.watch=[
      {id:this.id(),type:'bullet',text:'Design feedback from Maya'},
      {id:this.id(),type:'quote',text:'Ship it Friday — we’ll fix the edges next sprint. — Maya'},
      {id:this.id(),type:'bullet',text:'Vendor said they’d reply by Wed — chase if nothing by Thu.'},
    ];
    this.data.lists.later=[
      {id:this.id(),type:'bullet',text:'Learn Rust'},
      {id:this.id(),type:'quote',text:'The best way to predict the future is to invent it.'},
      {id:this.id(),type:'bullet',text:'Redesign portfolio'},
    ];
  }

  /* ---------- helpers ---------- */
  id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  mkTodo(text){ return {id:this.id(), type:'todo', text:text||'', done:false, children:[], collapsed:false}; }
  esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  fc(id){ return id===this._flash ? ' just-in' : ''; }

  find(arr, id){
    for(const b of arr){
      if(b.id===id) return {block:b, parent:arr};
      if(b.children){ const r=this.find(b.children,id); if(r) return r; }
    }
    return null;
  }
  locate(id){
    for(const k of ['todo','watch','later']){ const r=this.find(this.data.lists[k],id); if(r) return r; }
    return null;
  }

  /* ---------- rendering ---------- */
  render(){
    for(const k of ['todo','watch','later']){
      const el=document.getElementById('list-'+k);
      const arr=this.data.lists[k];
      el.innerHTML = arr.length ? arr.map(b=>this.renderBlock(b)).join('')
        : `<div class="empty-hint">Nothing here yet.</div>`;
    }
    this._flash=null;
  }
  renderBlock(b){
    const t=b.type||'todo';
    if(t==='todo') return this.renderTodo(b);
    if(t==='bullet') return `<div class="block bullet${this.fc(b.id)}" data-id="${b.id}">
        <span class="bdot">•</span>
        <span class="btext" contenteditable data-ph="Write…" oninput="app.edit('${b.id}','text',this.innerText)" onkeydown="app.bulletKey(event,'${b.id}')">${this.esc(b.text)}</span>
        <button class="del" onclick="app.del('${b.id}')">×</button></div>`;
    if(t==='link') return `<div class="block link${this.fc(b.id)}" data-id="${b.id}">
        <span class="bdot">🔗</span>
        <span class="linktext" contenteditable data-ph="Link text…" oninput="app.edit('${b.id}','label',this.innerText)" onkeydown="app.bulletKey(event,'${b.id}')">${this.esc(b.label)}</span>
        <a class="link-open" href="${this.esc(b.url)}" target="_blank" rel="noopener" title="${this.esc(b.url)}">↗</a>
        <button class="del" onclick="app.del('${b.id}')">×</button></div>`;
    if(t==='note') return `<div class="block note${this.fc(b.id)}" data-id="${b.id}">
        <div class="rich" contenteditable data-ph="Type a note…" oninput="app.edit('${b.id}','text',this.innerText)">${this.esc(b.text)}</div>
        <button class="del" onclick="app.del('${b.id}')">×</button></div>`;
    if(t==='quote') return `<div class="block quote${this.fc(b.id)}" data-id="${b.id}">
        <blockquote contenteditable data-ph="Paste or type a quote…" oninput="app.edit('${b.id}','text',this.innerText)">${this.esc(b.text)}</blockquote>
        <button class="del" onclick="app.del('${b.id}')">×</button></div>`;
    if(t==='photo') return `<figure class="block photo${this.fc(b.id)}" data-id="${b.id}">
        <img src="${b.src}" alt="">
        <figcaption contenteditable data-ph="Add a caption…" oninput="app.edit('${b.id}','caption',this.innerText)">${this.esc(b.caption)}</figcaption>
        <button class="del" onclick="app.del('${b.id}')">×</button></figure>`;
    return '';
  }
  renderTodo(b){
    const kids=b.children||[];
    const hasKids=kids.length>0;
    let prog='';
    if(hasKids){ const d=kids.filter(k=>k.done).length; prog=`<span class="prog">${d}/${kids.length}</span>`; }
    const twist = hasKids
      ? `<button class="twist ${b.collapsed?'':'open'}" onclick="app.toggleExpand('${b.id}')">▶</button>`
      : `<span class="twist-sp"></span>`;
    return `<div class="block todo ${b.done?'done':''}${this.fc(b.id)}" data-id="${b.id}">
      <div class="todo-row">
        ${twist}
        <span class="box" onclick="app.toggleDone('${b.id}')"></span>
        <span class="label" contenteditable data-ph="Task…" oninput="app.edit('${b.id}','text',this.innerText)">${this.esc(b.text)}</span>
        ${prog}
        <button class="mini" title="Add subtask" onclick="app.addSubtask('${b.id}')">＋</button>
        <button class="del" onclick="app.del('${b.id}')">×</button>
      </div>
      ${hasKids&&!b.collapsed?`<div class="children">${kids.map(k=>this.renderTodo(k)).join('')}<div class="subtask-add-row"><button class="subtask-add" onclick="app.addSubtask('${b.id}')">＋ Add subtask</button></div></div>`:''}
    </div>`;
  }

  /* ---------- mutations ---------- */
  edit(id, field, val){ const r=this.locate(id); if(r){ r.block[field]=val; this.save(); } } // no re-render (keep cursor)
  toggleDone(id){ const r=this.locate(id); if(r){ r.block.done=!r.block.done; this.save(); this.render(); } }
  toggleExpand(id){ const r=this.locate(id); if(r){ r.block.collapsed=!r.block.collapsed; this.save(); this.render(); } }
  del(id){ const r=this.locate(id); if(r){ const i=r.parent.indexOf(r.block); r.parent.splice(i,1); this.save(); this.render(); } }

  addTodo(listKey){
    const b=this.mkTodo('');
    this.data.lists[listKey].push(b); this._flash=b.id;
    this.save(); this.render(); this.focusBlock(b.id);
  }
  addTodoFromInput(){
    const inp=document.getElementById('todoInput');
    const text=inp.value.trim(); if(!text) return;
    const b=this.mkTodo(text);
    this.data.lists.todo.push(b); this._flash=b.id;
    inp.value=''; this.save(); this.render(); inp.focus();
  }
  addSubtask(parentId){
    const r=this.locate(parentId); if(!r) return;
    if(!r.block.children) r.block.children=[];
    const b=this.mkTodo('');
    r.block.children.push(b); r.block.collapsed=false; this._flash=b.id;
    this.save(); this.render(); this.focusBlock(b.id);
  }
  /* ---------- composer (Watch & Later): paste image → caption → Enter ---------- */
  composerAddImage(listKey, dataURL){
    this.composer[listKey].push(dataURL);
    this.renderThumbs(listKey);
    const inp=document.getElementById('input-'+listKey); if(inp) inp.focus();
  }
  removeThumb(listKey, idx){
    this.composer[listKey].splice(idx,1);
    this.renderThumbs(listKey);
  }
  renderThumbs(listKey){
    const wrap=document.getElementById('thumbs-'+listKey); if(!wrap) return;
    wrap.innerHTML=this.composer[listKey].map((src,i)=>
      `<div class="thumb"><img src="${src}" alt=""><button class="thumb-x" title="Remove" onclick="app.removeThumb('${listKey}',${i})">×</button></div>`
    ).join('');
  }
  composerSubmit(listKey){
    const inp=document.getElementById('input-'+listKey);
    const text=inp.value.trim();
    const imgs=this.composer[listKey];
    if(!imgs.length && !text) return;

    if(imgs.length){
      imgs.forEach((src,i)=>{
        // caption goes on the first image (typical: one image + its caption)
        const caption = (i===0 && imgs.length===1) ? text : '';
        const b={id:this.id(), type:'photo', src, caption}; this._flash=b.id;
        this.data.lists[listKey].push(b);
      });
      // if several images were attached, keep the typed text as its own bullet
      if(imgs.length>1 && text){
        this.data.lists[listKey].push({id:this.id(), type:'bullet', text});
      }
    } else {
      const b={id:this.id(), type:'bullet', text}; this._flash=b.id;
      this.data.lists[listKey].push(b);
    }
    this.composer[listKey]=[]; this.renderThumbs(listKey);
    inp.value=''; this.save(); this.render(); inp.focus();
  }
  bulletKey(ev, id){
    if(ev.key==='Enter' && !ev.shiftKey){
      ev.preventDefault();
      const r=this.locate(id); if(!r) return;
      const i=r.parent.indexOf(r.block);
      const b={id:this.id(), type:'bullet', text:''}; this._flash=b.id;
      r.parent.splice(i+1, 0, b);
      this.save(); this.render(); this.focusBlock(b.id);
    } else if(ev.key==='Backspace' && !ev.target.innerText.trim()){
      const r=this.locate(id); if(!r) return;
      const i=r.parent.indexOf(r.block);
      if(i<=0) return;                       // keep the first block
      ev.preventDefault();
      const prev=r.parent[i-1];
      r.parent.splice(i,1);
      this.save(); this.render(); this.focusBlock(prev.id);
    }
  }
  addBlock(listKey, type){
    if(type==='todo'){ this.addTodo(listKey); return; }
    if(type==='photo'){ this.pendingList=listKey; document.getElementById('photoInput').click(); return; }
    if(type==='link'){
      let url=prompt('Paste link URL:'); if(!url) return; url=url.trim();
      if(!/^https?:\/\//i.test(url)) url='https://'+url;
      let label; try{ label=new URL(url).hostname.replace(/^www\./,''); }catch(e){ label=url; }
      const b={id:this.id(), type:'link', url, label}; this._flash=b.id;
      this.data.lists[listKey].push(b);
      this.save(); this.render(); this.focusBlock(b.id); return;
    }
    const b = {id:this.id(), type, text:''};   // quote / note
    this.data.lists[listKey].push(b); this._flash=b.id;
    this.save(); this.render(); this.focusBlock(b.id);
  }
  focusBlock(id){
    requestAnimationFrame(()=>{
      const el=document.querySelector(`[data-id="${id}"] [contenteditable]`);
      if(el){ el.focus();
        const r=document.createRange(); r.selectNodeContents(el); r.collapse(false);
        const s=getSelection(); s.removeAllRanges(); s.addRange(r);
      }
    });
  }

  /* ---------- reveal & theme ---------- */
  toggleBoard(){
    const b=document.getElementById('board');
    b.classList.toggle('open');
    b.classList.toggle('solo', !b.classList.contains('open'));
    this.syncSoloWidth();
    this.data.revealed=b.classList.contains('open'); this.save();
  }
  toggleTheme(){ this.dark=!this.dark; this.applyTheme(); localStorage.setItem(this.THEME, this.dark?'1':'0'); }
  applyTheme(){ document.body.classList.toggle('dark', this.dark); }

  /* ---------- resizable cards ---------- */
  applySizes(){
    for(const key of ['todo','watch','later']){
      const el=document.getElementById('col-'+key); if(!el) continue;
      el.style.flex='0 1 '+this.data.sizes[key]+'px';
      el.style.minWidth='240px'; el.style.maxWidth='none';
      const h=this.data.heights[key];
      if(h){ el.style.height=h+'px'; el.classList.add('fixh'); }
      else { el.style.height=''; el.classList.remove('fixh'); }
    }
    this.syncSoloWidth();
  }
  syncSoloWidth(){
    const b=document.getElementById('board');
    if(!b) return;
    b.style.maxWidth = b.classList.contains('solo') ? (this.data.sizes.todo+44)+'px' : '';
  }
  startResize(ev, key){
    ev.preventDefault();
    const el=document.getElementById('col-'+key); if(!el) return;
    const handle=ev.currentTarget;
    const startX=ev.clientX, startW=this.data.sizes[key];
    const MIN=260, MAX=1500;
    handle.classList.add('dragging');
    document.body.classList.add('dragging-col');
    const move=(e)=>{
      let w=Math.round(startW + (e.clientX - startX));
      w=Math.max(MIN, Math.min(MAX, w));
      this.data.sizes[key]=w;
      el.style.flex='0 1 '+w+'px';
      if(key==='todo') this.syncSoloWidth();
    };
    const up=()=>{
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      handle.classList.remove('dragging');
      document.body.classList.remove('dragging-col');
      this.save();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  }
  startResizeV(ev, key){
    ev.preventDefault();
    const el=document.getElementById('col-'+key); if(!el) return;
    const handle=ev.currentTarget;
    const startY=ev.clientY;
    const startH=this.data.heights[key] || el.getBoundingClientRect().height;
    const MIN=200, MAX=1600;
    handle.classList.add('dragging');
    document.body.classList.add('dragging-row');
    el.classList.add('fixh');
    const move=(e)=>{
      let h=Math.round(startH + (e.clientY - startY));
      h=Math.max(MIN, Math.min(MAX, h));
      this.data.heights[key]=h;
      el.style.height=h+'px';
    };
    const up=()=>{
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      handle.classList.remove('dragging');
      document.body.classList.remove('dragging-row');
      this.save();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  }
  resetWidth(key){
    const def={todo:360, watch:470, later:840};
    this.data.sizes[key]=def[key]; this.applySizes(); this.save();
  }
  resetHeight(key){
    delete this.data.heights[key];
    const el=document.getElementById('col-'+key);
    if(el){ el.style.height=''; el.classList.remove('fixh'); }
    this.save();
  }

  /* frameless window controls (Tauri) */
  win(action){
    try{
      const w = window.__TAURI__.window.getCurrentWindow();
      if(action==='min') w.minimize();
      else if(action==='max') w.toggleMaximize();
      else if(action==='close') w.close();
    }catch(e){ console.error('window control failed', e); }
  }

  /* ---------- global wiring ---------- */
  wireGlobal(){
    // Ctrl+V image(s) into Watch or Later → attach as composer thumbnails (caption then Enter)
    document.addEventListener('paste', ev=>{
      const items = ev.clipboardData && ev.clipboardData.items; if(!items) return;
      const files=[];
      for(const it of items){ if(it.type && it.type.indexOf('image')===0){ const f=it.getAsFile(); if(f) files.push(f); } }
      if(!files.length) return;
      const col = ev.target.closest && ev.target.closest('.col');
      let listKey=null;
      if(col){ if(col.querySelector('#list-watch')) listKey='watch'; else if(col.querySelector('#list-later')) listKey='later'; }
      if(!listKey) return;                 // only Watch & Later accept pasted images
      ev.preventDefault();
      files.forEach(f=>{
        const reader=new FileReader();
        reader.onload=()=>this.composerAddImage(listKey, reader.result);
        reader.readAsDataURL(f);
      });
    });
    // toolbar 🖼 button → attach to composer the same way
    document.getElementById('photoInput').addEventListener('change', ev=>{
      const f=ev.target.files[0]; if(!f||!this.pendingList) return;
      const listKey=this.pendingList;
      const reader=new FileReader();
      reader.onload=()=>{ this.composerAddImage(listKey, reader.result); ev.target.value=''; this.pendingList=null; };
      reader.readAsDataURL(f);
    });
  }
}
const app=new ThreeLists();
app.init();
</script>
